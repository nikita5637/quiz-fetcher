version: "3.9"

services:
  fetcher:
    build:
      args:
        BASE_IMAGE: ${BASE_IMAGE}
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    command: "/bin/fetcher --config /etc/config.yaml"
    container_name: fetcher
    env_file:
      - path: .env
        required: false
    networks:
      - network

networks:
  network:
    driver: bridge
